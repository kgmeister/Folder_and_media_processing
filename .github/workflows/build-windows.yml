# Builds the portable Windows app on every push to main and publishes it as the latest GitHub release
# (SecureMediaProcessor-portable.zip: unzip anywhere, double-click "Secure Media Processor.cmd").
name: Build portable Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build portable app
        run: python make_portable.py --zip

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          gh release create "build-${GITHUB_RUN_NUMBER}" dist/SecureMediaProcessor-portable.zip \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${short})" \
            --notes "Portable app for Windows. Unzip anywhere, then double-click 'Secure Media Processor.cmd'. commit: ${GITHUB_SHA}" \
            --latest
